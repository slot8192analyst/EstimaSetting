<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>ESTIMA SETTING | スロット設定判別まとめ</title>
<meta name="description" content="スロットの設定判別・設定差をまとめたサイト。機種名で検索できます。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%230a0a0b%27/%3E%3Crect x=%279%27 y=%279%27 width=%2714%27 height=%2714%27 fill=%27%2338bdf8%27 transform=%27rotate(45 16 16)%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=JetBrains+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="gridbg" aria-hidden="true"></div>

<header class="hdr">
  <div class="wrap">
    <a class="logo" href="./">
      <i></i>
      <span class="lt">
        <span>ESTIMA<em>SETTING</em></span>
        <small>SLOT SETTING GUIDE</small>
      </span>
    </a>
    <nav class="nav">
      <a class="k" href="#list"><b>01</b>機種一覧</a>
    </nav>
  </div>
</header>

<main>
  <section class="sec first" id="list">
    <div class="wrap">
      <div class="sec-head">
        <span class="no">01</span>
        <h1>MACHINES</h1>
        <span class="jp">機種一覧</span>
        <span class="r" id="total"></span>
      </div>

      <div class="toolbar">
        <div class="chips" id="chips" role="tablist" aria-label="機種タイプで絞り込み"></div>
        <label class="search" id="searchBox">
          <span class="ico" aria-hidden="true"></span>
          <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off"
                 placeholder="機種名・演出名で検索（例: ミリゴ / 月山 / おみくじ）" aria-label="機種検索">
          <span class="clear" id="clear" role="button" aria-label="クリア">✕</span>
          <kbd>/</kbd>
        </label>
      </div>

      <ul class="mlist" id="mlist" aria-live="polite"></ul>
      <div class="resultbar"><span id="resultCount"></span><span id="updated"></span></div>
    </div>
  </section>
</main>

<footer>
  <div class="mark" aria-hidden="true">ESTIMA</div>
  <div class="wrap">
    <span>© ESTIMA SETTING</span>
    <span>掲載数値は各解析サイトの公表・調査値。実戦は自己責任で。</span>
  </div>
</footer>

<script src="js/common.js"></script>
<script src="js/index.js"></script>
</body>
</html>
